[binaries]
c = 'aarch64-linux-android29-clang'
cpp = 'aarch64-linux-android29-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[built-in options]
c_args = ['-fPIC', '-DGLES', '-DGLES3', '-DGL_ES', '-D__ANDROID__']
cpp_args = ['-fPIC', '-DGLES', '-DGLES3', '-DGL_ES', '-D__ANDROID__']
c_link_args = ['-fPIC', '-lGLESv3', '-lGLESv2', '-lEGL', '-llog']
cpp_link_args = ['-fPIC', '-lGLESv3', '-lGLESv2', '-lEGL', '-llog']